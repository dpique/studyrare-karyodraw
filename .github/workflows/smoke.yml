name: Smoke

# Three curls a day: nothing else watches the live site between deploys. A failed
# run triggers GitHub's failed-workflow email to the owner. Deliberately minimal,
# by owner decision: no external monitoring service, no state, no thresholds.
# Each check asserts content, not just a 200, so a blank page cannot pass.

on:
  schedule:
    - cron: '30 13 * * *'   # daily, 30 min after the feedback-digest cron
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Cloudflare 403s GitHub's runner IPs at the edge (observed twice on
    # 2026-08-12: default curl UA and a browser-shaped UA both blocked, so it is
    # IP-level bot protection, not the user-agent). The checks therefore carry a
    # bypass header that a WAF custom rule on the zone is configured to skip bot
    # protection for; the token lives in the SMOKE_BYPASS repo secret and the
    # rule is documented in the owner's private claude-workflows repo
    # (RESTORE-karyodraw-d1.md sits beside it). The UA still names the monitor.
    env:
      UA: 'Mozilla/5.0 (compatible; KaryoDrawSmoke/1.0; +https://github.com/dpique/studyrare-karyodraw)'
      SMOKE_BYPASS: ${{ secrets.SMOKE_BYPASS }}
    steps:
      - name: Homepage serves the app
        run: curl -fsS -A "$UA" -H "x-karyodraw-smoke: $SMOKE_BYPASS" --max-time 20 'https://karyodraw.com/' | grep -q 'Karyotype diagram maker'
      - name: A landing page serves
        run: curl -fsS -A "$UA" -H "x-karyodraw-smoke: $SMOKE_BYPASS" --max-time 20 'https://karyodraw.com/karyotype/down-syndrome/' | grep -q 'Down syndrome'
      - name: The API answers
        run: curl -fsS -A "$UA" -H "x-karyodraw-smoke: $SMOKE_BYPASS" --max-time 20 'https://karyodraw.com/api/top' | grep -q '"items"'
