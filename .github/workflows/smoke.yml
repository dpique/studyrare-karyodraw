name: Smoke

# Three curls a day: nothing else watches the live site between deploys. A failed
# run triggers GitHub's failed-workflow email to the owner. Deliberately minimal,
# by owner decision: no external monitoring service, no state, no thresholds.
# Each check asserts content, not just a 200, so a blank page cannot pass.

on:
  schedule:
    - cron: '30 13 * * *'   # daily, 30 min after the feedback-digest cron
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read   # the freshness check reads the last successful deploy run

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Cloudflare used to turn these runs away: HTTP 403 with
    # `cf-mitigated: challenge`, from Bot Fight Mode, which challenged the
    # runner's Azure address on every request between 2026-08-11 and
    # 2026-08-12 (19 events in the zone log, several distinct runner IPs, both
    # a default curl UA and a browser-shaped one). The fix was to turn Bot
    # Fight Mode off at the zone, because it is the only one available: Bot
    # Fight Mode is a free-plan feature evaluated off the Ruleset Engine, so no
    # WAF skip rule and no allowlist can except it. A bypass header and a
    # SMOKE_BYPASS secret were carried here for two days on the theory that a
    # skip rule would work. They could never have worked, and they are gone.
    #
    # If these checks start returning 403 again, read the last step's headers
    # before changing anything here. `cf-mitigated: challenge` means the zone is
    # challenging the runner again, and the answer is on the zone's Security
    # page, not in this file.
    #
    # Every run string is a block scalar, and should stay one: a plain YAML
    # scalar cannot contain a colon followed by a space, and an inline `run:`
    # that broke this rule made the whole file unparseable on 2026-08-12.
    # GitHub reported that as a zero-second failed run with no jobs and no
    # logs. test/ops.test.js parses these files rather than grepping them.
    env:
      UA: 'Mozilla/5.0 (compatible; KaryoDrawSmoke/1.0; +https://github.com/dpique/studyrare-karyodraw)'
    steps:
      - name: Homepage serves the app
        run: |
          curl -fsS -A "$UA" --max-time 20 'https://karyodraw.com/' | grep -q 'Karyotype diagram maker'
      - name: A landing page serves
        run: |
          curl -fsS -A "$UA" --max-time 20 'https://karyodraw.com/karyotype/down-syndrome/' | grep -q 'Down syndrome'
      - name: The API answers
        run: |
          curl -fsS -A "$UA" --max-time 20 'https://karyodraw.com/api/top' | grep -q '"items"'
      # Liveness is not freshness: the deploy step used to be able to skip while
      # its run stayed green, and three content curls cannot tell a current site
      # from a week-old one. The Worker stamps every deploy with its commit
      # (deploy.yml passes GITHUB_SHA), so compare the live stamp against the
      # last successful deploy. Comparing against main HEAD instead would race
      # any merge whose deploy is still in flight.
      - name: The live site is the last successful deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          live="$(curl -fsS -A "$UA" --max-time 20 'https://karyodraw.com/api/version' | sed -E 's/.*"sha"[:] *"([^"]*)".*/\1/')"
          want="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --status success --limit 1 --json headSha --jq '.[0].headSha')"
          echo "live $live / last deployed $want"
          test -n "$want"
          test "$live" = "$want"
      # A failed check above reports only "exited 22", which cannot tell the
      # site being down from Cloudflare turning the runner away. Those two want
      # opposite responses from whoever opens the failure email, so name the
      # mitigation: cf-mitigated and the status line say which one happened.
      - name: Why the edge said no
        if: failure()
        run: |
          curl -sS -o /dev/null -D - -A "$UA" --max-time 20 'https://karyodraw.com/' \
            | grep -iE '^(HTTP/|server|cf-ray|cf-mitigated|retry-after)' || true
