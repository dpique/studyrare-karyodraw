name: Deploy to Cloudflare

# Publishes the site on every push to main that touches a served file (and on
# demand via "Run workflow"). This closes the hands-off loop: a brand-sync PR
# (or any content change) merged to main goes live automatically.
#
# Requires ONE repo secret: CLOUDFLARE_API_TOKEN. A missing token FAILS the
# run: this workflow is the only deploy path, so a green run has to mean a
# deployed site. (It used to skip gracefully, green with a warning, which
# would have let an expired token ship nothing behind passing checks forever.)

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '404.html'
      - '*.js'
      - 'content/**'
      - 'karyotype/**'
      - 'scripts/**'
      - 'preview.png'
      - 'favicon.ico'
      - 'favicon.svg'
      - 'favicon-96x96.png'
      - 'apple-touch-icon.png'
      - 'robots.txt'
      - 'wrangler.jsonc'
      - '.assetsignore'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

permissions:
  contents: read

# One deploy at a time, in order. Two merges in quick succession must not race
# each other to Cloudflare, where the later commit could finish first and then
# be overwritten by the earlier one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # The suite gates the deploy: if a test fails, nothing ships. npm test also
  # regenerates the landing pages first (the pretest hook), so a build script
  # broken badly enough to fail fails here too.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Regenerate the SEO landing pages, the homepage "Common karyotypes" list,
      # and sitemap.xml from content/karyotypes.js. Generated output is not
      # committed (only the PNG karyograms are); this step is what puts it in
      # the directory wrangler uploads.
      - name: Build landing pages
        run: node scripts/build-pages.mjs
      - name: Deploy with wrangler
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set. This is the only deploy path, so a green run must mean a deployed site. Add the token in Settings ▸ Secrets and variables ▸ Actions."
            exit 1
          fi
          npx --yes wrangler@4 deploy --var DEPLOY_SHA:"$GITHUB_SHA"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      # Tell IndexNow (Bing, Yandex, and other participating engines) about the URL
      # set so new/changed pages are crawled quickly. Google ignores IndexNow; it is
      # covered by the sitemap + Search Console. Non-fatal.
      - name: Ping IndexNow
        if: steps.deploy.outputs.deployed == 'true'
        run: node scripts/indexnow.mjs || true
